AWSTemplateFormatVersion: '2010-09-09'
Description: Account-level monthly AWS budget for the Job Radar showcase

Parameters:
  BudgetEmail:
    Type: String
    Description: Address for the monthly AWS cost alert
    AllowedPattern: '^[^@ ]+@[^@ ]+\.[^@ ]+$'

Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly-cost'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
